name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (major.minor.patch)'
        required: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Pack OrkSvg
      run: >
        dotnet pack OrkSvg.csproj
        -c Release
        -p:Version=${{ inputs.version }}
        -o dist

    - name: Prepare Unversioned Package
      shell: pwsh
      run: |
        Move-Item dist/*.nupkg dist/OrkSvg.nupkg

    - name: Upload Packages
      uses: actions/upload-artifact@v7
      with:
        name: OrkSvg-Packages
        path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all packages
      uses: actions/download-artifact@v8
      with:
        name: OrkSvg-Packages
        path: dist
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ inputs.version }}
        name: v${{ inputs.version }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
